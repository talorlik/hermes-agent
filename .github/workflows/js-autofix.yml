name: auto-fix lint issues & formatting

# On push to main (or manual trigger), run `npm run fix` on each workspace
# package and apply any changes via a PR that merges immediately.
#
# Fixable lint issues (import sorting, unused imports, curly braces, etc.) are
# auto-corrected on merge so PRs aren't blocked by them. The PR-time eslint
# check in typecheck.yml fails only when un-fixable errors remain.
#
# NOTE: App token pushes DO trigger further workflow runs (unlike
# secrets.GITHUB_TOKEN). The concurrency group (ts-autofix-${{ github.ref }})
# with cancel-in-progress: true prevents an infinite loop — a re-triggered
# run cancels the in-flight one, and since the second run finds no new fixes
# (the first run already applied them), it exits with an empty patch.
#
# ── Security model: three-job pipeline ─────────────────────────────────────
#
# The eslint process executes repo code (eslint.config.mjs, package.json
# scripts, installed plugins). To prevent a malicious PR from getting arbitrary
# code execution on a runner with push access, the work is split:
#
#   1. cleanup-stale-prs (privileged, contents: write + pull-requests: write)
#      Runs FIRST on every workflow run (even when there are no fixes to apply).
#      Closes any open bot/js-autofix PRs that are stale (base behind main,
#      conflicted, CI failed, auto-merge not working). This ensures PRs never
#      hang indefinitely if main moves or CI fails after the workflow completes.
#
#   2. generate-patch (unprivileged, contents: read only)
#      Checks out, installs deps, runs eslint --fix, produces a .patch artifact.
#      Worst case: malicious code runs here on an ephemeral runner with zero
#      push permissions.
#
#   3. apply-patch (privileged, contents: write + pull-requests: write)
#      Checks out, downloads the patch artifact, applies it, pushes to the
#      bot/js-autofix branch, creates a PR, and merges immediately.
#      This job never runs npm, never installs anything, never executes any
#      repo code. The only input it trusts is the patch artifact.
#      Skipped entirely when generate-patch reports no fixes (has-fixes != true).
#
#      Merge strategy:
#      - First tries auto-merge (works if branch protection requires CI checks)
#      - If auto-merge doesn't stick (no required checks configured), merges
#        directly via `gh pr merge --squash --delete-branch`
#      - This prevents PRs from sitting in limbo when CI checks never appear
#        (common with app tokens that don't trigger pull_request workflows)

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read # default; apply-patch job overrides to write

concurrency:
  group: ts-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always run cleanup first, even when there are no fixes. This ensures stale
  # PRs get closed even if subsequent runs find nothing to fix.
  cleanup-stale-prs:
    name: Clean up stale bot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Sweep stale bot/js-autofix PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          echo "Checking for stale bot/js-autofix PRs to clean up..."

          # Find any open PRs on the bot branch
          STALE_PRS=$(gh pr list --head "$BOT_BRANCH" --state open --json number,baseRefOid,createdAt 2>/dev/null || echo "[]")
          PR_COUNT=$(echo "$STALE_PRS" | jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No open bot/js-autofix PRs found."
            exit 0
          fi

          echo "Found $PR_COUNT open PR(s) on $BOT_BRANCH. Checking if they're stale..."

          # Get current main SHA
          CURRENT_MAIN=$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')
          CURRENT_TIME=$(date +%s)

          echo "$STALE_PRS" | jq -c '.[]' | while IFS= read -r pr; do
            PR_NUM=$(echo "$pr" | jq -r '.number')
            BASE_SHA=$(echo "$pr" | jq -r '.baseRefOid')
            CREATED_AT=$(echo "$pr" | jq -r '.createdAt')

            echo "Checking PR #$PR_NUM (base: ${BASE_SHA:0:8}, created: $CREATED_AT)..."

            # Check if base is behind main (most common case: main moved after the PR was created)
            if [ "$BASE_SHA" != "$CURRENT_MAIN" ]; then
              # Count how far behind
              BEHIND=$(git rev-list --count "$BASE_SHA..$CURRENT_MAIN" 2>/dev/null || echo "unknown")
              echo "PR #$PR_NUM base (${BASE_SHA:0:8}) is $BEHIND commits behind current main (${CURRENT_MAIN:0:8})."
              echo "Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing stale PR: base was ${BASE_SHA:0:8}, now $BEHIND commits behind current main (${CURRENT_MAIN:0:8}). Next js-autofix run will re-apply on current state." || true
              continue
            fi

            # Check if PR is conflicted
            MERGEABLE=$(gh pr view "$PR_NUM" --json mergeable --jq '.mergeable')
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #$PR_NUM is conflicted. Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing conflicted PR. Next js-autofix run will re-apply cleanly." || true
              continue
            fi

            # Check if CI checks failed
            if gh pr checks "$PR_NUM" 2>/dev/null | grep -qi "fail"; then
              echo "PR #$PR_NUM has failed CI checks. Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing PR with failed CI checks. Next js-autofix run will re-apply." || true
              continue
            fi

            # Check if PR has been open for more than 10 minutes with auto-merge but no checks
            # This catches the case where auto-merge is enabled but CI never runs
            AUTOMERGE=$(gh pr view "$PR_NUM" --json autoMergeRequest --jq '.autoMergeRequest != null')
            PR_AGE_SECONDS=$(( CURRENT_TIME - $(date -d "$CREATED_AT" +%s 2>/dev/null || echo "$CURRENT_TIME") ))
            if [ "$AUTOMERGE" = "true" ] && [ "$PR_AGE_SECONDS" -gt 600 ]; then
              # Check if there are any check runs at all
              HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid')
              CHECK_COUNT=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" --jq '.total_count' 2>/dev/null || echo "0")
              if [ "$CHECK_COUNT" = "0" ]; then
                echo "PR #$PR_NUM has auto-merge enabled but no CI checks after 10+ minutes."
                echo "This indicates CI won't run. Closing + deleting branch."
                gh pr close "$PR_NUM" --delete-branch --comment "Closing: auto-merge enabled but no CI checks appeared after 10+ minutes (app token may not trigger workflows). Next run will merge directly." || true
                continue
              fi
            fi

            # If auto-merge is not enabled and PR is old (shouldn't happen with new code)
            if [ "$AUTOMERGE" != "true" ] && [ "$PR_AGE_SECONDS" -gt 300 ]; then
              echo "PR #$PR_NUM does not have auto-merge enabled and is >5 minutes old."
              echo "Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing PR: auto-merge was not enabled. Next js-autofix run will retry with direct merge." || true
              continue
            fi

            # If we're about to generate new fixes, close the old PR so we can create a fresh one.
            # If generate-patch finds no fixes, this PR stays (it's healthy and current).
            echo "PR #$PR_NUM appears healthy and current. Leaving open unless new fixes are found."
          done

          echo "Stale PR cleanup complete."

  generate-patch:
    name: Generate eslint --fix patch
    needs: cleanup-stale-prs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-fixes: ${{ steps.produce-patch.outputs.has-fixes }}
    # No permissions override → inherits workflow-level contents: read.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          npm i -g npm@12

      # --ignore-scripts: eslint only needs TS sources + eslint packages.
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts

      - name: npm run fix in all workspaces
        # continue-on-error: if un-fixable errors exist on main, we still want
        # to commit whatever fixes were applied. The PR-time check in
        # typecheck.yml is what blocks un-fixable errors from landing.
        continue-on-error: true
        run: npm run fix

      - name: Produce patch
        id: produce-patch
        run: |
          # Exclude every file that the dep-version-gate ruleset guards
          # (package manifests, eslint configs, workflow files). A patch
          # that contains one of these files makes the bot PR wait for a
          # team review, and auto-merge then stops. The check step in
          # typecheck.yml still reports their lint errors.
          # The (glob) magic makes "**/" also match files at the repo
          # root, which plain pathspec wildcards do not.
          EXCLUDES=(
            ':(exclude,glob)**/package.json'
            ':(exclude,glob)**/package-lock.json'
            ':(exclude,glob)**/eslint.config.*'
            ':(exclude,glob).github/**'
          )
          if git diff --quiet -- . "${EXCLUDES[@]}"; then
            echo "No fixes needed."
            echo "has-fixes=false" >> "$GITHUB_OUTPUT"
            # Empty patch signals "nothing to do" to apply-patch.
            : > js-fix.patch
          else
            git diff -- . "${EXCLUDES[@]}" > js-fix.patch
            echo "has-fixes=true" >> "$GITHUB_OUTPUT"
            echo "Patch size: $(wc -c < js-fix.patch) bytes"

            # Reject patches that touch anything outside JS/TS/JSON sources.
            # `npm run fix` should only ever modify those; anything else means
            # eslint/prettier or a plugin went rogue and we refuse to ship it.
            BAD=$(git diff --name-only -- . "${EXCLUDES[@]}" | grep -vE '\.(js|cjs|mjs|ts|tsx|json)$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::Refusing to upload patch — touches disallowed files:"
              echo "$BAD"
              exit 1
            fi
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-fix-patch
          path: js-fix.patch
          retention-days: 1
          include-hidden-files: true

  apply-patch:
    name: Apply patch
    needs: [cleanup-stale-prs, generate-patch]
    # Skip entirely when generate-patch found no fixes — saves a runner,
    # avoids a redundant checkout/download, and keeps the job graph honest.
    if: needs.generate-patch.outputs.has-fixes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trusted-automation
    permissions:
      contents: write # needed to push to bot/js-autofix
      pull-requests: write # needed for PR creation + auto-merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Close any remaining open PRs before applying new fixes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          # Cleanup should have removed stale PRs, but if a healthy PR exists
          # (same base as main, auto-merge enabled, CI passing), close it now
          # so we can create a fresh one with the latest fixes.
          PR_NUM=$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR_NUM" ]; then
            echo "Found open PR #$PR_NUM. Closing to create fresh PR with new fixes."
            gh pr close "$PR_NUM" --delete-branch --comment "Closing to apply fresh fixes from latest run." || true
          fi

      - name: Download patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: js-fix-patch
          # ${{ runner.temp }} expands in with: params (shell-style $VAR does not).
          # download-artifact's path is a *directory* — the artifact's js-fix.patch
          # file lands inside it, so $RUNNER_TEMP/js-fix.patch resolves correctly
          # in the run step below.
          path: ${{ runner.temp }}

      - name: Apply patch and push to bot branch
        env:
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          # Empty patch = nothing to do.
          if [ ! -s "$RUNNER_TEMP/js-fix.patch" ]; then
            echo "Patch is empty. No fixes to apply."
            exit 0
          fi

          # Apply the patch produced by the unprivileged job.
          git apply --check "$RUNNER_TEMP/js-fix.patch" || {
            echo "::error::Patch does not apply cleanly. Branch may have moved."
            exit 1
          }
          git apply "$RUNNER_TEMP/js-fix.patch"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fmt(js): \`npm run fix\` on merge"

          # Push to the dedicated bot branch. Force-push is safe here:
          # bot/js-autofix is a bot-only branch that gets rewritten each run.
          # If the branch was deleted after a previous PR merge, this
          # recreates it.
          git push --force origin HEAD:"$BOT_BRANCH"

      - name: Create PR and merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          # Create PR if one doesn't exist. If it already exists, the
          # force-push above already updated it with the latest fixes.
          PR_NUM=$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUM" ]; then
            # gh pr create prints the PR URL. Extract the number from it
            # (https://github.com/<org>/<repo>/pull/<number>).
            PR_URL=$(gh pr create \
              --head "$BOT_BRANCH" --base main \
              --title 'fmt(js): `npm run fix` auto-fix' \
              --body 'Auto-generated by the `auto-fix lint issues & formatting` workflow. Merges automatically once created (no CI checks configured for bot PRs).')
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #$PR_NUM"
          fi

          # Strategy: Try auto-merge first (works if branch protection is configured).
          # If auto-merge doesn't stick (no required checks configured), merge directly.
          # This is safe because:
          # 1. The patch comes from an unprivileged job (no untrusted code execution)
          # 2. The PR is created by a trusted bot on a bot-only branch
          # 3. The fixes are deterministic (eslint --fix)

          echo "Attempting to enable auto-merge..."
          if gh pr merge "$PR_NUM" --auto --squash 2>/dev/null; then
            # Check if auto-merge actually stuck
            sleep 2
            AUTOMERGE=$(gh pr view "$PR_NUM" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$AUTOMERGE" = "true" ]; then
              echo "✓ Auto-merge enabled successfully. PR will merge when checks pass."
              exit 0
            fi
          fi

          # Auto-merge didn't stick. This happens when:
          # - No required status checks are configured, OR
          # - Branch protection doesn't require reviews, OR
          # - The app token doesn't trigger workflows that would create checks
          echo "⚠ Auto-merge did not enable (no required checks or branch protection)."
          echo "Checking if PR is immediately mergeable..."

          # Wait a moment for GitHub to compute mergeability
          sleep 3
          PR_STATE=$(gh pr view "$PR_NUM" --json mergeable,mergeStateStatus)
          MERGEABLE=$(echo "$PR_STATE" | jq -r '.mergeable')
          MERGE_STATE=$(echo "$PR_STATE" | jq -r '.mergeStateStatus')

          echo "PR #$PR_NUM state: mergeable=$MERGEABLE, mergeStateStatus=$MERGE_STATE"

          # If mergeable or unknown (common for just-created PRs), merge directly
          if [ "$MERGEABLE" = "MERGEABLE" ] || [ "$MERGEABLE" = "UNKNOWN" ] || [ "$MERGE_STATE" = "CLEAN" ]; then
            echo "PR is mergeable. Merging directly (squash)..."
            if gh pr merge "$PR_NUM" --squash --delete-branch; then
              echo "✓ PR #$PR_NUM merged successfully."
              exit 0
            else
              echo "::error::Direct merge failed. Closing PR."
              gh pr close "$PR_NUM" --delete-branch --comment "Auto-merge unavailable and direct merge failed. Next run will retry." || true
              exit 1
            fi
          fi

          # If we get here, the PR is not mergeable (conflicted, blocked, etc.)
          echo "::error::PR #$PR_NUM is not mergeable (state: $MERGEABLE/$MERGE_STATE)."
          echo "This shouldn't happen for a bot PR on a force-pushed branch."
          gh pr close "$PR_NUM" --delete-branch --comment "PR not mergeable (state: $MERGEABLE/$MERGE_STATE). Next run will retry." || true
          exit 1

      - name: Wait for auto-merge (if enabled)
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PR_NUM=$(gh pr list --head bot/js-autofix --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUM" ]; then
            echo "No open PR (already merged or closed). Nothing to wait for."
            exit 0
          fi

          # Check if auto-merge is enabled. If not, the previous step merged directly.
          AUTOMERGE=$(gh pr view "$PR_NUM" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$AUTOMERGE" != "true" ]; then
            echo "Auto-merge not enabled. PR was either merged directly or will be handled by cleanup."
            exit 0
          fi

          echo "Auto-merge is enabled. Monitoring PR #$PR_NUM until it merges or fails..."

          # Poll every 15s for up to ~10 minutes initially, then back off.
          MAX_FAST_CHECKS=40    # 40 × 15s = 10 minutes
          MAX_MEDIUM_CHECKS=12  # 12 × 60s = 12 minutes (cumulative: 22 min)

          check_pr_status() {
            STATE=$(gh pr view "$PR_NUM" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
              echo "PR #$PR_NUM is $STATE."
              return 0
            fi

            # If main moved, the PR may have already merged (which moves
            # main) or another commit landed. Re-check state first.
            CURRENT_SHA=$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha')
            if [ "$CURRENT_SHA" != "$START_SHA" ]; then
              STATE=$(gh pr view "$PR_NUM" --json state --jq '.state')
              if [ "$STATE" = "MERGED" ]; then
                echo "PR #$PR_NUM merged (main moved to ${CURRENT_SHA:0:8})."
                return 0
              fi
              echo "Main moved ($START_SHA → $CURRENT_SHA). Closing stale PR."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing: base became stale after main moved to ${CURRENT_SHA:0:8}." || true
              return 0
            fi

            # If CI checks failed, close + delete the branch.
            if gh pr checks "$PR_NUM" 2>/dev/null | grep -qi "fail"; then
              echo "CI failed on PR #$PR_NUM. Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing: CI checks failed. Next run will re-apply." || true
              return 0
            fi

            # If PR is conflicted, close + delete the branch.
            MERGEABLE=$(gh pr view "$PR_NUM" --json mergeable --jq '.mergeable')
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #$PR_NUM is conflicted. Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch --comment "Closing: PR became conflicted. Next run will re-apply." || true
              return 0
            fi

            # Still open and healthy
            return 1
          }

          # Fast polling: 15s intervals for 10 minutes
          for i in $(seq 1 $MAX_FAST_CHECKS); do
            sleep 15
            if check_pr_status; then
              exit 0
            fi
          done

          echo "Fast polling complete (10 min). Switching to medium polling (60s intervals)..."

          # Medium polling: 60s intervals for 12 minutes
          for i in $(seq 1 $MAX_MEDIUM_CHECKS); do
            sleep 60
            if check_pr_status; then
              exit 0
            fi
          done

          # After 22 minutes, verify auto-merge is still working
          AUTOMERGE=$(gh pr view "$PR_NUM" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$AUTOMERGE" != "true" ]; then
            echo "::warning::Auto-merge is no longer enabled on PR #$PR_NUM after 22 minutes."
            echo "Closing PR since auto-merge disappeared."
            gh pr close "$PR_NUM" --delete-branch --comment "Closing: auto-merge was disabled or failed. Next run will retry." || true
            exit 0
          fi

          echo "Medium polling complete (22 min total). Auto-merge is still enabled."
          echo "Exiting poll loop. PR #$PR_NUM will merge when CI passes, or the next"
          echo "workflow run will clean it up if it becomes stale."
